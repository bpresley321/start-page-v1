<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Start Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: mountain banner on top, then 4 fixed columns. 1 = icons + tasks + weather, 2 = news, 3 = links, 4 = spare. */
:root{
  --bg:#e6ecef; --panel:#ffffff; --ink:#15202a; --muted:#5b6a77; --line:#d8e0e5;
  --accent:#0f6b62; --accent-ink:#ffffff; --accent-soft:#dcefec; --warn:#b3261e;
  --sky1:#24506f; --sky2:#8db3c9; --r1:#6f93ad; --r2:#3f6580; --r3:#24455a; --tree:#12303a; --sun:#ffe9b8;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f161c; --panel:#18222a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3741;
    --accent:#4fc4b4; --accent-ink:#0b1512; --accent-soft:#17342f; --warn:#f2877f;
    --sky1:#0a1726; --sky2:#27455f; --r1:#2b4a63; --r2:#1c3448; --r3:#11222f; --tree:#0a1820; --sun:#d7e3ef; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3741;
  --accent:#4fc4b4; --accent-ink:#0b1512; --accent-soft:#17342f; --warn:#f2877f;
  --sky1:#0a1726; --sky2:#27455f; --r1:#2b4a63; --r2:#1c3448; --r3:#11222f; --tree:#0a1820; --sun:#d7e3ef; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,12.5px);line-height:1.3;--pad:2px}
body[data-size="xsmall"]{--fs:11.5px;--pad:1px}
body[data-size="small"]{--fs:12.5px;--pad:2px}
body[data-size="medium"]{--fs:14px;--pad:4px}
body[data-size="large"]{--fs:16px;--pad:6px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* banner */
.banner{position:relative;min-height:150px;overflow:hidden;border-radius:0 0 16px 16px;color:#fff;background:var(--sky1)}
.banner svg,.banner .photo{position:absolute;inset:0;width:100%;height:100%}
.banner .photo{background:center 42%/cover no-repeat;display:none}
.banner.has-photo .photo{display:block}.banner.has-photo svg{display:none}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,30,.55),rgba(8,12,30,0) 55%),linear-gradient(180deg,rgba(8,12,30,.25),rgba(8,12,30,0) 50%)}
.bn{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:14px 12px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 14px;min-height:150px}
.who{flex:1 1 220px;min-width:0;text-shadow:0 1px 6px rgba(0,0,0,.45)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.02em}
.sub{opacity:.92;font-variant-numeric:tabular-nums}
.search{display:flex;gap:6px;flex:1 1 240px;max-width:380px}
.search input{flex:1;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
input[type=text],input[type=search],input:not([type]),select,textarea{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:.92em}
.btn:disabled{opacity:.45;cursor:default}

/* columns */
.wrap{max-width:1500px;margin:0 auto;padding:10px 10px 40px}
.cols{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (min-width:700px){.cols{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.cols{grid-template-columns:repeat(4,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col:empty{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.card h2{font-family:var(--display);font-size:1.08em;font-weight:700;margin:0 0 5px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card h2 .gname{flex:1;min-width:0;font:700 1em var(--display);padding:3px 6px}
.hint{color:var(--muted);font-size:.95em;border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center}

/* link lists */
.ll{list-style:none;margin:0;padding:0}
.ll li{display:flex;align-items:center;gap:2px;border-radius:7px}
.ll li a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:var(--pad) 5px;border-radius:7px}
.ll li a:hover,.icons a:hover{background:var(--accent-soft)}
.ll li a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{position:relative;flex:none;display:block;width:18px;height:18px}
.logo .tile{position:absolute;inset:0;border-radius:5px;display:grid;place-items:center;font:700 10px var(--display);color:#fff}
.logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:5px;background:#fff;padding:1px;object-fit:contain}
.icons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:2px}
.icons li{position:relative}
.icons a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;text-align:center}
.icons .logo{width:28px;height:28px}
.icons .logo .tile{font-size:13px;border-radius:7px}
.icons .logo img{border-radius:7px;padding:2px}
.icons a span{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.icons .x{position:absolute;top:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:50%;font-size:12px;padding:0 5px;line-height:1.3}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:1px 6px;border-radius:6px}
.x:hover{color:var(--warn)}
.empty{color:var(--muted);font-size:.95em;padding:3px 5px;list-style:none}

/* edit mode */
.edit-only{display:none!important}
.editing .edit-only{display:block!important}
.editing .edit-only.flex,.editing .gtools.edit-only{display:flex!important}
.editing .addlink.edit-only{display:grid!important}
.editing .view-only{display:none!important}
.addlink{grid-template-columns:1fr;gap:5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.addlink input{width:100%}
.gtools{gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.gtools select{padding:3px 6px}
.add{display:flex;gap:5px}
.add input{flex:1;min-width:0}

/* tasks */
.prog{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.todos{list-style:none;margin:0 0 6px;padding:0}
.todos li{display:flex;align-items:center;gap:8px;padding:var(--pad) 1px}
.todos input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex:none}
.todos label{flex:1;min-width:0;overflow-wrap:anywhere}
.todos li.done label{text-decoration:line-through;color:var(--muted)}

/* weather */
.city{display:flex;gap:5px;margin:0 0 6px}
.city input{flex:1;min-width:0}
.wx-now{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.wx-temp{font-family:var(--display);font-size:2.6em;font-weight:700;line-height:1;letter-spacing:-.03em}
.wx-meta{color:var(--muted)}.wx-meta b{color:var(--ink)}
.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.forecast div{display:flex;flex-direction:column;gap:1px;align-items:center}
.forecast b{color:var(--ink);font-variant-numeric:tabular-nums}.forecast small{font-size:.82em}
.tag{font:500 10.5px var(--body);color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{padding:5px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border:0}
.news a{display:block;font-weight:500;text-wrap:balance}
.news a:hover{color:var(--accent)}
.news small{color:var(--muted);font-size:.85em}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:56px 16px 16px;overflow:auto;z-index:10}
.scrim.open{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.panel h3{font-family:var(--display);margin:0;font-size:19px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.panel label input,.panel label select,.panel label textarea{color:var(--ink);font-size:15px}
.panel textarea{min-height:100px;font:12px ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:12.5px;color:var(--muted)}
.team{padding:5px 0;border-bottom:1px solid var(--line)}
.team:last-child{border:0}
.tl{color:var(--muted);font-variant-numeric:tabular-nums}
.res{color:var(--muted)}.res.rW{color:var(--accent)}.res.rL{color:var(--warn)}
.sc{color:var(--ink)}
.pill{font:700 9.5px var(--body);letter-spacing:.04em;background:var(--warn);color:#fff;padding:1px 6px;border-radius:99px}
.cam{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.cam iframe{display:block;width:100%;height:100%;border:0}
.camnote{margin-top:5px;color:var(--muted);font-size:.9em}.camnote a{color:var(--accent);text-decoration:underline}
#c4,#c4-rest{display:flex;flex-direction:column;gap:10px;min-width:0}
</style>
</head>
<body data-size="small">
<header class="banner" id="banner">
  <!-- Original mountain illustration. Add a file named header.jpg next to index.html to use your own photo instead. -->
  <svg viewBox="0 0 1200 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
    <rect width="1200" height="120" fill="url(#sky)"/>
    <circle cx="980" cy="34" r="14" style="fill:var(--sun)" opacity=".9"/>
    <path style="fill:var(--r1)" d="M0 84 L90 57 L150 72 L240 36 L330 71 L420 51 L520 78 L640 33 L740 67 L850 48 L960 75 L1070 42 L1200 71 L1200 120 L0 120Z"/>
    <path fill="#fff" opacity=".9" d="M240 36 L225 53 L235 49 L242 55 L249 48 L258 53Z M640 33 L623 54 L634 50 L641 57 L649 49 L659 54Z M1070 42 L1057 58 L1065 55 L1071 60 L1078 54 L1085 58Z"/>
    <path style="fill:var(--r2)" d="M0 99 L110 75 L210 90 L330 66 L450 91 L560 77 L690 96 L800 72 L930 95 L1050 79 L1200 96 L1200 120 L0 120Z"/>
    <path style="fill:var(--r3)" d="M0 111 Q150 99 300 109 T600 108 T900 110 T1200 107 L1200 120 L0 120Z"/>
    <path id="trees" style="fill:var(--tree)" d=""/>
  </svg>
  <div class="photo" id="photo"></div>
  <div class="bn">
    <div class="who">
      <h1 id="greet">Start page</h1>
      <div class="sub" id="clock"></div>
    </div>
    <form class="search" id="search" role="search">
      <input id="q" type="search" placeholder="Search Google" aria-label="Search Google">
      <button class="btn pri" type="submit">Search</button>
    </form>
    <div class="tools">
      <button class="btn" id="btn-add" type="button">+ Link</button>
      <button class="btn" id="btn-edit" type="button" aria-pressed="false">Edit</button>
      <button class="btn" id="btn-set" type="button">Settings</button>
    </div>
  </div>
</header>

<div class="wrap" id="app"><main class="cols" id="cols"><div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div><div class="col" id="c4"><div id="cam-host"></div><div class="col" id="c4-rest"></div></div></main></div>

<!-- quick add link -->
<div class="scrim" id="sc-add">
  <form class="panel" id="f-add">
    <h3>Add a link</h3>
    <label for="a-title">Name<input id="a-title" type="text" autocomplete="off" placeholder="Fort Worth Star-Telegram"></label>
    <label for="a-url">Address<input id="a-url" type="text" autocomplete="off" placeholder="star-telegram.com"></label>
    <label for="a-group">Group<select id="a-group"></select></label>
    <label for="a-new" id="a-new-wrap" hidden>New group name<input id="a-new" type="text" autocomplete="off"></label>
    <div class="status" id="a-err" role="alert"></div>
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Add link</button></div>
  </form>
</div>

<!-- settings -->
<div class="scrim" id="sc-set">
  <div class="panel">
    <h3>Settings</h3>
    <label for="s-city">City for weather<input id="s-city" type="text" autocomplete="off" placeholder="Fort Worth, TX"></label>
    <label for="s-size">Text size<select id="s-size"><option value="xsmall">Extra small</option><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label>
    <label for="s-io">Backup (copy this text to save, paste to restore)<textarea id="s-io" spellcheck="false"></textarea></label>
    <div class="row">
      <button type="button" class="btn" id="s-copy">Copy backup</button>
      <button type="button" class="btn" id="s-import">Restore from text</button>
    </div>
    <div class="status" id="s-status" role="status"></div>
    <div class="row"><button type="button" class="btn pri" data-close>Done</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function L(t,u){return {id:uid(),t,u};}
const NEWS=[['nyt','New York Times'],['fwreport','Fort Worth Report']];
const NEWS_LIMIT=6;

function defaults(){
  return {
    city:'Fort Worth, TX', size:'small', name:'Ben', m1:true, m2:true, m3:true, m4:true,
    tasks:[{id:uid(),t:'Find birth certificates',done:false}],
    groups:[
      {id:uid(),name:'Popular',col:1,icons:true,links:[L('Gmail','https://mail.google.com'),L('YouTube','https://www.youtube.com'),L('Reddit','https://www.reddit.com'),L('Facebook','https://www.facebook.com'),L('Sheets','https://docs.google.com/spreadsheets'),L('Docs','https://docs.google.com/document'),L('Calendar','https://calendar.google.com'),L('Maps','https://maps.google.com'),L('Drive','https://drive.google.com'),L('GitHub','https://github.com'),L('Claude','https://claude.ai'),L('Amazon','https://www.amazon.com')]},
      {id:uid(),name:'News links',col:3,links:[L('New York Times','https://www.nytimes.com'),L('Local news near you','https://news.google.com/search?q={city}'),L('NPR','https://www.npr.org'),L('AP News','https://apnews.com'),L('Hacker News','https://news.ycombinator.com')]},
      {id:uid(),name:'Weather',col:3,links:weatherLinks()},
      {id:uid(),name:'Outdoors',col:3,links:[L('REI','https://www.rei.com'),L('Recreation.gov','https://www.recreation.gov'),L('AllTrails','https://www.alltrails.com'),L('Hipcamp','https://www.hipcamp.com')]}
    ]
  };
}
// Weather links carried over from the old start page. Only addresses that could be confirmed are included.
function weatherLinks(){ return [
  L('Forecast for your city','https://www.google.com/search?q=weather+{city}'),
  L('Fort Worth/Dallas, TX (NWS)','https://www.weather.gov/fwd/'),
  L('Storm Prediction Center Outlooks','https://www.spc.noaa.gov/products/outlook/'),
  L('National Hurricane Center','https://www.nhc.noaa.gov/'),
  L('Texas Storm Chasers','https://www.facebook.com/TxStormChasers'),
  L('Purgatory - Weather, Conditions & Webcams','https://www.purgatory.ski/mountain/weather-conditions-webcams/'),
  L('Watch Duty','https://www.watchduty.org/'),
  L('Texas County Burn Bans','https://tfsweb.tamu.edu/wildfire-and-other-disasters/burn-bans-and-information/'),
  L('Clear Fork Trinity River at Fort Worth','https://water.noaa.gov/gauges/FWHT2'),
  L('Clear Fk Trinity Rv nr Benbrook, TX','https://waterdata.usgs.gov/monitoring-location/08047000/')
]; }
function migrate(){
  S.m1=true;
  if(!S.m2){
    S.m2=true; S.size='small';
    S.groups.forEach(g=>{ if(!g.col) g.col=(g.name==='Popular')?1:3; if(g.name==='Popular'&&g.icons===undefined) g.icons=true; });
  }
  if(!S.m3){ S.m3=true; S.groups=S.groups.filter(g=>g.name!=='Purgatory Webcams'); }
  if(!S.m4){
    S.m4=true;
    const g=S.groups.find(x=>x.name==='Weather links');
    if(g){ g.name='Weather'; g.links=weatherLinks(); }
    else if(!S.groups.some(x=>x.name==='Weather')) S.groups.push({id:uid(),name:'Weather',col:3,links:weatherLinks()});
  }
  save();
}
let S=defaults(), editing=false;
try{ const raw=localStorage.getItem('startpage-v2'); if(raw){ const sv=JSON.parse(raw); S=Object.assign(defaults(),sv); S.m1=!!sv.m1; S.m2=!!sv.m2; S.m3=!!sv.m3; S.m4=!!sv.m4; } }catch(e){}
function save(){ try{ localStorage.setItem('startpage-v2',JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
function normUrl(u){
  u=u.trim(); if(!u) return null;
  if(!/^https?:\/\//i.test(u)){ if(/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^[^/]+:\d+/.test(u)) return null; u='https://'+u; }
  try{ const x=new URL(u.replace(/\{city\}/g,'x')); return /^https?:$/.test(x.protocol)?u:null; }catch(e){ return null; }
}
function resolve(u){ return u.replace(/\{city\}/g,encodeURIComponent(S.city||'')); }
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function hostOf(u){ try{ return new URL(u.replace(/\{city\}/g,'x')).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
// Site logo from the web, with a colored letter tile underneath in case it does not load.
function logo(l){
  const host=hostOf(l.u), ch=(l.t.trim()[0]||host[0]||'?').toUpperCase();
  const img=host?`<img src="https://www.google.com/s2/favicons?domain=${esc(host)}&sz=64" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="logo" aria-hidden="true"><i class="tile" style="background:hsl(${hue(host||l.t)} 45% 38%)">${esc(ch)}</i>${img}</span>`;
}
function findGroup(id){ return S.groups.find(g=>g.id===id); }
function colOf(g){ const c=+g.col; return c>=1&&c<=4?c:3; }
function ago(iso){ if(!iso) return ''; const m=Math.round((Date.now()-new Date(iso))/60000); if(m<1) return 'now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' hr ago'; return Math.round(h/24)+' d ago'; }

/* ---------- cards ---------- */
const cache={weather:null,news:{},sports:null};
function tasksCard(){
  const d=S.tasks.filter(t=>t.done).length, n=S.tasks.length;
  return `<section class="card" aria-labelledby="h-tasks"><h2 id="h-tasks">Tasks</h2>
  <div class="prog"><span>${d} of ${n}</span><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div></div>
  <ul class="todos">${S.tasks.map(t=>`<li class="${t.done?'done':''}"><input type="checkbox" id="t-${t.id}" data-act="toggle" data-id="${t.id}" ${t.done?'checked':''}><label for="t-${t.id}">${esc(t.t)}</label><button class="x" data-act="deltask" data-id="${t.id}" aria-label="Delete task ${esc(t.t)}">×</button></li>`).join('')}</ul>
  <form class="add" data-form="task"><input id="newtask" placeholder="New task" aria-label="New task" autocomplete="off"><button class="btn pri" type="submit">Add</button></form>
  ${d?`<button class="btn sm" data-act="cleardone" type="button" style="margin-top:6px">Clear completed</button>`:''}
  </section>`;
}
function weatherCard(){
  const w=cache.weather;
  let body='<div class="empty">Loading…</div>';
  if(w&&w.error) body=`<div class="empty" role="alert">${esc(w.error)}</div>`;
  else if(w) body=`<div class="wx-now"><div class="wx-temp">${w.now.temp}°</div><div class="wx-meta"><b>${esc(w.now.text)}</b><br>Feels ${w.now.feels}° · Wind ${w.now.wind} mph</div></div>
    <div class="forecast">${w.days.map(d=>`<div><span>${new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'})}</span><b>${d.hi}°</b><span>${d.lo}°</span><small>${esc(d.text)}</small></div>`).join('')}</div>`;
  return `<section class="card" aria-labelledby="h-wx"><h2 id="h-wx">Weather${w&&w.place?`<span class="tag">${esc(w.place)}</span>`:''}</h2>
  <form class="city" data-form="city"><input id="city-input" value="${esc(S.city)}" aria-label="City" placeholder="City, State"><button class="btn sm" type="submit">Set city</button></form>${body}</section>`;
}
function newsCard(key,title){
  const n=cache.news[key];
  let body='<li class="empty">Loading…</li>';
  if(n&&n.error) body=`<li class="empty" role="alert">${esc(n.error)} <button class="btn sm" data-act="retry-news" data-key="${key}" type="button">Retry</button></li>`;
  else if(n) body=n.items.length?n.items.slice(0,NEWS_LIMIT).map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><small>${ago(i.time)}</small></li>`).join(''):'<li class="empty">No stories.</li>';
  return `<section class="card" aria-label="${esc(title)}"><h2>${esc(title)}</h2><ul class="news">${body}</ul></section>`;
}
function when(iso){
  if(!iso) return '';
  const d=new Date(iso), t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const today=new Date().toDateString()===d.toDateString();
  return today?'Today '+t:d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'})+' '+t;
}
function dayOf(iso){ return iso?new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'}):''; }
function teamRow(t){
  if(t.error) return `<div class="team"><b>${esc(t.label)}</b><div class="tl">${esc(t.error)}${t.detail?` · ${esc(t.detail)}`:''}</div></div>`;
  const vs=g=>(g.home?'vs ':'at ')+esc(g.opp);
  let out='';
  if(t.live) out+=`<div class="tl"><span class="pill">LIVE</span> ${vs(t.live)} <b class="sc">${t.live.us??''}–${t.live.them??''}</b> ${esc(t.live.detail)}</div>`;
  if(t.last) out+=`<div class="tl">Last: <b class="res r${t.last.result||''}">${t.last.result||''}</b> ${t.last.us??''}–${t.last.them??''} ${vs(t.last)} · ${dayOf(t.last.date)}</div>`;
  out+=t.next?`<div class="tl">Next: ${vs(t.next)} · ${when(t.next.date)}</div>`:`<div class="tl">${t.live?'':'No game scheduled'}</div>`;
  return `<div class="team"><b>${esc(t.label)}</b>${out}</div>`;
}
function sportsCard(){
  const s=cache.sports;
  let body='<div class="empty">Loading…</div>';
  if(s&&s.error) body=`<div class="empty" role="alert">${esc(s.error)} <button class="btn sm" data-act="retry-sports" type="button">Retry</button></div>`;
  else if(s) body=s.teams.map(teamRow).join('');
  return `<section class="card" aria-label="Sports"><h2>Sports</h2>${body}</section>`;
}
function groupCard(g,i){
  const items=g.links.map(l=>{
    const x=`<button class="x edit-only flex" data-act="dellink" data-g="${g.id}" data-id="${l.id}" aria-label="Remove ${esc(l.t)}">×</button>`;
    return g.icons
      ?`<li><a href="${esc(resolve(l.u))}" target="_blank" rel="noopener" title="${esc(l.t)}">${logo(l)}<span>${esc(l.t)}</span></a>${x}</li>`
      :`<li><a href="${esc(resolve(l.u))}" target="_blank" rel="noopener">${logo(l)}<span>${esc(l.t)}</span></a>${x}</li>`;
  }).join('');
  const c=colOf(g);
  return `<section class="card" aria-label="${esc(g.name)}">
  <h2><span class="view-only">${esc(g.name)}</span><input class="gname edit-only" data-act="rename" data-g="${g.id}" value="${esc(g.name)}" aria-label="Group name"></h2>
  <ul class="${g.icons?'icons':'ll'}">${items||'<li class="empty">No links yet.</li>'}</ul>
  <form class="addlink edit-only" data-form="link" data-g="${g.id}"><input name="t" placeholder="Name" aria-label="Link name" autocomplete="off"><input name="u" placeholder="Address, like example.com" aria-label="Link address" autocomplete="off"><button class="btn sm pri" type="submit">Add link</button></form>
  <div class="gtools edit-only"><label>Column <select data-act="col" data-g="${g.id}" aria-label="Column for ${esc(g.name)}">${[1,2,3,4].map(n=>`<option value="${n}" ${n===c?'selected':''}>${n}</option>`).join('')}</select></label>
    <button class="btn sm" data-act="icons" data-g="${g.id}" type="button">${g.icons?'Show as list':'Show as icons'}</button>
    <button class="btn sm" data-act="up" data-g="${g.id}" type="button" ${i===0?'disabled':''}>Move up</button><button class="btn sm" data-act="down" data-g="${g.id}" type="button" ${i===S.groups.length-1?'disabled':''}>Move down</button>
    <button class="btn sm danger" data-act="delgroup" data-g="${g.id}" type="button">Delete group</button></div>
  </section>`;
}
function render(){
  document.body.dataset.size=S.size||'small';
  $('#app').classList.toggle('editing',editing);
  $('#btn-edit').textContent=editing?'Done':'Edit';
  $('#btn-edit').classList.toggle('on',editing);
  $('#btn-edit').setAttribute('aria-pressed',editing);
  const byCol=n=>S.groups.map((g,i)=>[g,i]).filter(([g])=>colOf(g)===n).map(([g,i])=>groupCard(g,i)).join('');
  const addGroup=`<section class="card edit-only" aria-label="Add group"><h2>New group</h2><form class="add" data-form="group"><input id="newgroup" placeholder="Group name" aria-label="Group name" autocomplete="off"><button class="btn pri" type="submit">Add</button></form></section>`;
  const c4=byCol(4);
  // The camera card lives in #cam-host and is never re-rendered, so the video is not restarted by data refreshes.
  $('#c1').innerHTML=`${byCol(1)}${weatherCard()}${tasksCard()}`;
  $('#c2').innerHTML=`${NEWS.map(n=>newsCard(n[0],n[1])).join('')}${byCol(2)}`;
  $('#c3').innerHTML=byCol(3);
  $('#c4-rest').innerHTML=`${sportsCard()}${c4}${addGroup}`;
}
const CAM={name:'Purgatory snow stake',url:'https://player.brownrice.com/embed/purgatorysnowstake1/live'};
$('#cam-host').innerHTML=`<section class="card" aria-label="Webcam"><h2>Webcam <span class="tag">${esc(CAM.name)}</span></h2>
  <div class="cam"><iframe src="${esc(CAM.url)}" title="${esc(CAM.name)} webcam" loading="lazy" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="camnote">Blank? The camera may block embedding. <a href="${esc(CAM.url)}" target="_blank" rel="noopener">Open it in a new tab</a></div></section>`;

/* ---------- live data ---------- */
async function getJson(url){ const r=await fetch(url); const j=await r.json().catch(()=>({})); if(!r.ok) return {error:j.error||'Could not load'}; return j; }
function softRender(){ const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; render(); }
async function loadWeather(){ cache.weather=null; softRender(); cache.weather=await getJson('/api/weather?city='+encodeURIComponent(S.city||'')).catch(()=>({error:'Weather is unavailable right now'})); softRender(); }
async function loadSports(){ cache.sports=await getJson('/api/sports').catch(()=>({error:'Scores are unavailable right now'})); softRender(); }
async function loadNews(key){ cache.news[key]=null; softRender(); cache.news[key]=await getJson('/api/news?feed='+key).catch(()=>({error:'Could not load this feed'})); softRender(); }

/* ---------- banner ---------- */
(function(){
  let d='',x=-10,i=0;
  while(x<1210){ const h=7+((i*37)%7), w=5+((i*13)%4); d+=`M${x} 120 L${x+w/2} ${120-h} L${x+w} 120Z `; x+=w*0.7+((i*7)%5); i++; }
  $('#trees').setAttribute('d',d);
  const img=new Image();
  img.onload=()=>{ $('#photo').style.backgroundImage='url(header.jpg)'; $('#banner').classList.add('has-photo'); };
  img.src='header.jpg';
})();
function tick(){
  const n=new Date(), h=n.getHours();
  $('#greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+(S.name?', '+S.name:'');
  $('#clock').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
tick(); setInterval(tick,15000);
$('#search').addEventListener('submit',e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return;
  const a=document.createElement('a'); a.href='https://www.google.com/search?q='+encodeURIComponent(q); a.target='_blank'; a.rel='noopener'; a.click();
});

/* ---------- actions ---------- */
const root=$('#cols');
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'&&b.type!=='checkbox') return;
  const act=b.dataset.act, g=b.dataset.g?findGroup(b.dataset.g):null;
  if(act==='toggle'){ const t=S.tasks.find(x=>x.id===b.dataset.id); t.done=b.checked; }
  else if(act==='deltask'){ S.tasks=S.tasks.filter(x=>x.id!==b.dataset.id); }
  else if(act==='cleardone'){ S.tasks=S.tasks.filter(x=>!x.done); }
  else if(act==='dellink'){ g.links=g.links.filter(l=>l.id!==b.dataset.id); }
  else if(act==='icons'){ g.icons=!g.icons; }
  else if(act==='up'||act==='down'){ const i=S.groups.indexOf(g), j=act==='up'?i-1:i+1; if(j<0||j>=S.groups.length) return; [S.groups[i],S.groups[j]]=[S.groups[j],S.groups[i]]; }
  else if(act==='retry-news'){ loadNews(b.dataset.key); return; }
  else if(act==='retry-sports'){ loadSports(); return; }
  else if(act==='delgroup'){
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; }
    S.groups=S.groups.filter(x=>x!==g);
  } else return;
  save(); render();
});
root.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='rename'){ const g=findGroup(el.dataset.g); g.name=el.value.trim()||g.name; save(); }
  if(el.dataset.act==='col'){ findGroup(el.dataset.g).col=+el.value; save(); render(); }
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, kind=f.dataset.form;
  if(kind==='task'){ const v=f.querySelector('input').value.trim(); if(!v) return; S.tasks.unshift({id:uid(),t:v,done:false}); }
  else if(kind==='group'){ const v=f.querySelector('input').value.trim(); if(!v) return; S.groups.push({id:uid(),name:v,col:4,links:[]}); }
  else if(kind==='city'){ const v=f.querySelector('input').value.trim(); if(!v) return; S.city=v; save(); loadWeather(); return; }
  else if(kind==='link'){
    const t=f.elements.t.value.trim(), u=normUrl(f.elements.u.value);
    if(!u){ f.elements.u.focus(); f.elements.u.setCustomValidity('Enter a web address'); f.elements.u.reportValidity(); f.elements.u.setCustomValidity(''); return; }
    findGroup(f.dataset.g).links.push(L(t||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],u));
  } else return;
  save(); render();
  if(kind==='task') $('#newtask').focus();
});
$('#btn-edit').onclick=()=>{ editing=!editing; render(); };

/* quick add */
function open(id){ $(id).classList.add('open'); }
function closeAll(){ document.querySelectorAll('.scrim').forEach(s=>s.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeAll));
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeAll(); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
$('#btn-add').onclick=()=>{
  $('#a-group').innerHTML=S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')+'<option value="__new">New group…</option>';
  $('#a-new-wrap').hidden=true; $('#a-err').textContent=''; $('#f-add').reset();
  open('#sc-add'); $('#a-title').focus();
};
$('#a-group').onchange=e=>{ $('#a-new-wrap').hidden=e.target.value!=='__new'; };
$('#f-add').addEventListener('submit',e=>{
  e.preventDefault();
  const u=normUrl($('#a-url').value);
  if(!u){ $('#a-err').textContent='Enter a web address, like example.com.'; return; }
  let g;
  if($('#a-group').value==='__new'){
    const n=$('#a-new').value.trim(); if(!n){ $('#a-err').textContent='Name the new group.'; return; }
    g={id:uid(),name:n,col:3,links:[]}; S.groups.push(g);
  } else g=findGroup($('#a-group').value);
  g.links.push(L($('#a-title').value.trim()||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],u));
  save(); render(); closeAll();
});

/* settings */
$('#btn-set').onclick=()=>{
  $('#s-city').value=S.city; $('#s-size').value=S.size||'small'; $('#s-io').value=JSON.stringify(S); $('#s-status').textContent='Saved in this browser.'; open('#sc-set');
};
$('#s-city').addEventListener('change',e=>{ const v=e.target.value.trim(); if(v){ S.city=v; save(); loadWeather(); } });
$('#s-size').addEventListener('change',e=>{ S.size=e.target.value; save(); render(); });
$('#s-copy').onclick=async()=>{
  $('#s-io').value=JSON.stringify(S); $('#s-io').select();
  try{ await navigator.clipboard.writeText($('#s-io').value); $('#s-status').textContent='Backup copied.'; }
  catch(e){ $('#s-status').textContent='Select the text above and copy it.'; }
};
$('#s-import').onclick=()=>{
  try{
    const d=JSON.parse($('#s-io').value);
    if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks)) throw 0;
    S=Object.assign(defaults(),d); S.m1=!!d.m1; S.m2=!!d.m2; S.m3=!!d.m3; S.m4=!!d.m4; migrate(); render(); loadWeather();
    $('#s-city').value=S.city; $('#s-size').value=S.size;
    $('#s-status').textContent='Restored.';
  }catch(e){ $('#s-status').textContent='That text is not a valid backup.'; }
};

migrate(); render(); loadWeather(); loadSports(); NEWS.forEach(n=>loadNews(n[0]));
setInterval(loadSports,5*60*1000);
setInterval(()=>{ loadWeather(); NEWS.forEach(n=>loadNews(n[0])); },15*60*1000);
</script>
</body>
</html>
