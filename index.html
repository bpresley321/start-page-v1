<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Start Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: mountain banner on top, then 4 fixed columns. 1 = icons + tasks + weather, 2 = news, 3 = links, 4 = spare. */
:root{
  --bg:#e6ecef; --panel:#ffffff; --ink:#15202a; --muted:#5b6a77; --line:#d8e0e5;
  --accent:#0f6b62; --accent-ink:#ffffff; --accent-soft:#dcefec; --warn:#b3261e;
  --sky1:#24506f; --sky2:#8db3c9; --r1:#6f93ad; --r2:#3f6580; --r3:#24455a; --tree:#12303a; --sun:#ffe9b8;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f161c; --panel:#18222a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3741;
    --accent:#4fc4b4; --accent-ink:#0b1512; --accent-soft:#17342f; --warn:#f2877f;
    --sky1:#0a1726; --sky2:#27455f; --r1:#2b4a63; --r2:#1c3448; --r3:#11222f; --tree:#0a1820; --sun:#d7e3ef; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3741;
  --accent:#4fc4b4; --accent-ink:#0b1512; --accent-soft:#17342f; --warn:#f2877f;
  --sky1:#0a1726; --sky2:#27455f; --r1:#2b4a63; --r2:#1c3448; --r3:#11222f; --tree:#0a1820; --sun:#d7e3ef; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,12.5px);line-height:1.3;--pad:2px}
body[data-size="xsmall"]{--fs:11.5px;--pad:1px}
body[data-size="small"]{--fs:12.5px;--pad:2px}
body[data-size="medium"]{--fs:14px;--pad:4px}
body[data-size="large"]{--fs:16px;--pad:6px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* banner */
.banner{position:relative;min-height:150px;overflow:hidden;border-radius:0 0 16px 16px;color:#fff;background:var(--sky1)}
.banner svg,.banner .photo{position:absolute;inset:0;width:100%;height:100%}
.banner .photo{background:center 42%/cover no-repeat;display:none}
.banner.has-photo .photo{display:block}.banner.has-photo svg{display:none}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,30,.55),rgba(8,12,30,0) 55%),linear-gradient(180deg,rgba(8,12,30,.25),rgba(8,12,30,0) 50%)}
.bn{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:14px 12px 44px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 14px;min-height:150px;box-sizing:border-box}
.who{flex:1 1 220px;min-width:0;text-shadow:0 1px 6px rgba(0,0,0,.45)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.02em}
.sub{opacity:.92;font-variant-numeric:tabular-nums}
.search{display:flex;gap:6px;flex:1 1 240px;max-width:380px}
.search input{flex:1;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
input[type=text],input[type=search],input:not([type]),select,textarea{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:.92em}
.btn:disabled{opacity:.45;cursor:default}

/* columns */
.wrap{max-width:1500px;margin:0 auto;padding:10px 10px 40px}
.cols{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (min-width:700px){.cols{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.cols{grid-template-columns:repeat(4,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col:empty{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.card h2{font-family:var(--display);font-size:1.08em;font-weight:700;margin:0 0 5px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card h2 .gname{flex:1;min-width:0;font:700 1em var(--display);padding:3px 6px}
.hint{color:var(--muted);font-size:.95em;border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center}

/* link lists */
.ll{list-style:none;margin:0;padding:0}
.ll li{display:flex;align-items:center;gap:2px;border-radius:7px}
.ll li a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:var(--pad) 5px;border-radius:7px}
.ll li a:hover,.icons a:hover{background:var(--accent-soft)}
.ll li a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{position:relative;flex:none;display:block;width:18px;height:18px}
.logo .tile{position:absolute;inset:0;border-radius:5px;display:grid;place-items:center;font:700 10px var(--display);color:#fff}
.logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:5px;background:#fff;padding:1px;object-fit:contain}
.icons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:2px}
.icons li{position:relative}
.icons a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;text-align:center}
.icons .logo{width:28px;height:28px}
.icons .logo .tile{font-size:13px;border-radius:7px}
.icons .logo img{border-radius:7px;padding:2px}
.icons a span{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.icons .x{position:absolute;top:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:50%;font-size:12px;padding:0 5px;line-height:1.3}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:1px 6px;border-radius:6px}
.x:hover{color:var(--warn)}
.empty{color:var(--muted);font-size:.95em;padding:3px 5px;list-style:none}

/* edit mode */
.edit-only{display:none!important}
.editing .edit-only{display:block!important}
.editing .edit-only.flex,.editing .gtools.edit-only{display:flex!important}
.editing .addlink.edit-only{display:grid!important}
.editing .view-only{display:none!important}
.addlink{grid-template-columns:1fr;gap:5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.addlink input{width:100%}
.gtools{gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.gtools select{padding:3px 6px}
.add{display:flex;gap:5px}
.add input{flex:1;min-width:0}

/* tasks */
.prog{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.todos{list-style:none;margin:0 0 6px;padding:0}
.todos li{display:flex;align-items:center;gap:8px;padding:var(--pad) 1px}
.todos input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex:none}
.todos label{flex:1;min-width:0;overflow-wrap:anywhere}
.todos li.done label{text-decoration:line-through;color:var(--muted)}

/* weather */
.city{display:flex;gap:5px;margin:0 0 6px}
.wtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 6px;padding-bottom:2px;scrollbar-width:thin}
.wtab{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.wtab>button{border:0;background:none;color:var(--muted);padding:3px 9px;cursor:pointer;font:inherit;border-radius:99px;white-space:nowrap}
.wtab.on{background:var(--accent-soft);border-color:var(--accent)}.wtab.on>button{color:var(--accent);font-weight:600}
.wtab .wx-x{padding:3px 7px 3px 0;color:var(--muted)}
.wtab-add{flex:none;border:1px dashed var(--line);border-radius:99px;background:none;color:var(--muted);padding:3px 11px;cursor:pointer;font:inherit}
.wtab-add:hover,.wtab-add.on{border-color:var(--accent);color:var(--accent)}
.city input{flex:1;min-width:0}
.wx-now{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.wx-temp{font-family:var(--display);font-size:2.6em;font-weight:700;line-height:1;letter-spacing:-.03em}
.wx-meta{color:var(--muted);line-height:1.35}.wx-meta b{color:var(--ink)}
.astro{display:inline-flex;gap:8px;align-items:center;font-size:.9em;white-space:nowrap}.astro span{display:inline-flex;align-items:center;gap:3px}
.moon{width:12px;height:12px}
.wbug{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:.8em;line-height:1.1;text-align:center}
.wbug svg{width:36px;height:36px}
.wbug circle{fill:var(--accent-soft);stroke:var(--line)}
.wbug text{font-size:6px;font-weight:700;fill:var(--muted);text-anchor:middle}
.wbug path{fill:var(--accent)}
.wbug b{color:var(--ink)}.wbug small{display:block;font-size:.95em}
.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.forecast div{display:flex;flex-direction:column;gap:1px;align-items:center}
.forecast b{color:var(--ink);font-variant-numeric:tabular-nums}.forecast small{font-size:.82em}
.tag{text-decoration:none;font:500 10.5px var(--body);color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{padding:4px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border:0}
.news a{display:block;font-weight:500;text-wrap:balance}
.news a:hover{color:var(--accent)}
.news small{color:var(--muted);font-size:.85em}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:56px 16px 16px;overflow:auto;z-index:10}
.scrim.open{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.panel h3{font-family:var(--display);margin:0;font-size:19px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.panel label input,.panel label select,.panel label textarea{color:var(--ink);font-size:15px}
.panel textarea{min-height:100px;font:12px ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:12.5px;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,12,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.locked .gate{display:flex}body.locked #app,body.locked #mon,body.locked .ptabs{visibility:hidden}
.ptabs{position:absolute;z-index:2;left:0;right:0;bottom:0;max-width:1500px;margin:0 auto;padding:0 12px 9px;display:flex;gap:6px;pointer-events:none}
.ptabs a{pointer-events:auto;display:inline-flex;align-items:center;min-height:26px;box-sizing:border-box;padding:2px 13px;border-radius:99px;color:#fff;font-weight:600;font-size:.92em;text-decoration:none;background:rgba(10,14,30,.28);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.ptabs a:hover{background:rgba(10,14,30,.45)}
.ptabs a[aria-current="page"]{background:rgba(255,255,255,.88);color:#15202a;border-color:rgba(255,255,255,.9);text-shadow:none}
.ptabs a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mon{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
@media (min-width:900px){.mon{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.shop-add{display:flex;flex-wrap:wrap;gap:5px}
.shop-add #shop-url{flex:1 1 220px;min-width:0}
.shop-target{display:inline-flex;align-items:center;gap:3px;color:var(--muted)}
.shop-target input{width:72px}
.shop-msg{font-size:.88em;color:var(--muted);min-height:1.2em;margin:4px 0 2px}
.shop-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 9px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line)}
.shop-item .dot{width:10px;height:10px;border-radius:50%;align-self:center}
.shop-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:600}
.shop-item .nm:hover{color:var(--accent)}
.shop-item .pr{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.shop-item .meta{grid-column:2;color:var(--muted);font-size:.86em;display:flex;flex-wrap:wrap;gap:2px 10px}
.shop-item .meta .good{color:#1b7a43;font-weight:700}
.shop-item .ops{grid-column:3;display:flex;gap:4px;justify-content:flex-end}
.shop-item .ops button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:.86em;padding:0 2px}
.shop-item .ops button:hover{color:var(--accent)}
.shop-item .ops .rm.armed{color:var(--warn);font-weight:700}
.mrow{display:grid;grid-template-columns:14px minmax(110px,170px) 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .dot{width:11px;height:11px;border-radius:50%;align-self:center}
.mrow .t{font-weight:600}
.mrow .v{font-weight:700}
.mrow .d{grid-column:3;color:var(--muted);font-size:.9em}
.mrow a{grid-row:1;grid-column:4;color:var(--accent);text-decoration:none;font-size:.9em;font-weight:600;white-space:nowrap}
@media (max-width:560px){.mrow{grid-template-columns:14px 1fr auto}.mrow .v,.mrow .d{grid-column:2}.mrow a{grid-column:3}}
.st-green{background:#1f9d55}.st-yellow{background:#e0a100}.st-red{background:#d64545}.st-gray{background:#9aa5ae}
.stickers{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center;text-decoration:none;color:var(--ink);position:relative;padding:8px 9px}
.stickers:hover{border-color:var(--accent)}
.stk{display:inline-flex;align-items:center;gap:3px;padding:1px 6px 1px 5px;border-radius:99px;font-size:.8em;white-space:nowrap;color:var(--muted);border:1px solid transparent}
.stk b{color:var(--ink);font-weight:700}
.stk .dot{width:7px;height:7px;border-radius:50%;flex:none}
.stk-green{background:rgba(31,157,85,.1)}.stk-yellow{background:rgba(224,161,0,.16);border-color:rgba(224,161,0,.45)}
.stk-red{background:rgba(214,69,69,.14);border-color:rgba(214,69,69,.55)}.stk-gray{background:var(--accent-soft)}
.stk-plain{background:var(--accent-soft)}
.stk-msg{color:var(--muted);font-size:.9em;padding:2px}
.stk-go{display:none}
.mbadge{display:inline-block;margin-left:6px;min-width:18px;padding:0 6px;border-radius:99px;color:#fff;font-size:11px;line-height:17px;text-align:center;text-shadow:none}
body.on-mon #btn-add,body.on-mon #btn-edit{display:none}
.gate .panel{max-width:360px;text-align:center;align-items:center}
.gate p{margin:0;color:var(--muted)}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#1f1f1f;font-weight:600;text-decoration:none;font-size:15px}
.gbtn:hover{border-color:var(--accent)}
.gbtn svg{width:18px;height:18px}
.gate .err{color:var(--warn);font-size:13px}
#pass-ui:not([hidden]),#g-ui:not([hidden]){display:flex;flex-direction:column;gap:10px}
.code{font:12px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--accent-soft);padding:6px 8px;border-radius:6px;color:var(--ink);user-select:all}
.team{padding:5px 0;border-bottom:1px solid var(--line)}
/* calendar */
.cal-day{font-size:.82em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 0 2px}
.cal-day:first-of-type{margin-top:0}
.cal-ev{display:flex;align-items:baseline;gap:7px;padding:2px 0;min-width:0}
.cal-ev .t{flex:none;width:4.2em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.92em}
.cal-ev .dot,.cal-key .dot{flex:none;width:8px;height:8px;border-radius:50%;align-self:center}
.cal-ev .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev .n small{color:var(--muted)}
.cal-key{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:.85em;color:var(--muted)}
.cal-key span{display:inline-flex;align-items:center;gap:4px}
.cal-key .bad{color:var(--warn)}
.team:last-child{border:0}
.tl{color:var(--muted);font-variant-numeric:tabular-nums}
.res{color:var(--muted)}.res.rW{color:var(--accent)}.res.rL{color:var(--warn)}
.sc{color:var(--ink)}
.pill{font:700 9.5px var(--body);letter-spacing:.04em;background:var(--warn);color:#fff;padding:1px 6px;border-radius:99px}
.cam{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.cam iframe{display:block;width:100%;height:100%;border:0}
.snow{margin:0 0 6px}
.storm{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;margin:6px 0 4px;font-size:.85em;color:var(--muted);text-decoration:none}
.storm .risk{margin-right:4px;font-weight:600;padding:0 6px;border-radius:99px;color:#1d2a1d;border:1px solid rgba(0,0,0,.08)}
.storm .risk.none{background:var(--accent-soft);color:var(--muted)}
.storm .lbl{margin-right:2px}.storm.alert .lbl{font-weight:700;color:var(--ink)}
.storm:hover .risk{border-color:rgba(0,0,0,.35)}
.snow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:3px}
.snow-grid div{display:flex;flex-direction:column;align-items:center;padding:3px 2px;border-radius:6px;background:var(--accent-soft);line-height:1.15}
.snow-grid b{font-size:1.05em;font-variant-numeric:tabular-nums}
.snow-grid span{font-size:.75em;color:var(--muted);white-space:nowrap}
.camnote{margin-top:5px;color:var(--muted);font-size:.9em}.camnote a{color:var(--accent);text-decoration:underline}
</style>
</head>
<body data-size="small">
<header class="banner" id="banner">
  <!-- Original mountain illustration. Add a file named header.jpg next to index.html to use your own photo instead. -->
  <svg viewBox="0 0 1200 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
    <rect width="1200" height="120" fill="url(#sky)"/>
    <circle cx="980" cy="34" r="14" style="fill:var(--sun)" opacity=".9"/>
    <path style="fill:var(--r1)" d="M0 84 L90 57 L150 72 L240 36 L330 71 L420 51 L520 78 L640 33 L740 67 L850 48 L960 75 L1070 42 L1200 71 L1200 120 L0 120Z"/>
    <path fill="#fff" opacity=".9" d="M240 36 L225 53 L235 49 L242 55 L249 48 L258 53Z M640 33 L623 54 L634 50 L641 57 L649 49 L659 54Z M1070 42 L1057 58 L1065 55 L1071 60 L1078 54 L1085 58Z"/>
    <path style="fill:var(--r2)" d="M0 99 L110 75 L210 90 L330 66 L450 91 L560 77 L690 96 L800 72 L930 95 L1050 79 L1200 96 L1200 120 L0 120Z"/>
    <path style="fill:var(--r3)" d="M0 111 Q150 99 300 109 T600 108 T900 110 T1200 107 L1200 120 L0 120Z"/>
    <path id="trees" style="fill:var(--tree)" d=""/>
  </svg>
  <div class="photo" id="photo"></div>
  <div class="bn">
    <div class="who">
      <h1 id="greet">Start page</h1>
      <div class="sub" id="clock"></div>
    </div>
    <form class="search" id="search" role="search">

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function L(t,u){return {id:uid(),t,u};}
const NEWS=[['nyt','New York Times'],['txtribune','Texas Tribune'],['fwreport','Fort Worth Report']];
const NEWS_LIMIT=5;

function defaults(){
  return {
    city:'Fort Worth, TX', size:'small', name:'Ben', m1:true, m2:true, m3:true, m4:true, m5:true, m6:true, m7:true,
    tasks:[{id:uid(),t:'Find birth certificates',done:false}],
    shop:[],
    groups:[
      {id:uid(),name:'Popular',col:2,icons:true,links:[L('Gmail','https://mail.google.com'),L('YouTube','https://www.youtube.com'),L('Reddit','https://www.reddit.com'),L('Facebook','https://www.facebook.com'),L('Sheets','https://docs.google.com/spreadsheets'),L('Docs','https://docs.google.com/document'),L('Calendar','https://calendar.google.com'),L('Maps','https://maps.google.com'),L('Drive','https://drive.google.com'),L('GitHub','https://github.com'),L('Claude','https://claude.ai'),L('Amazon','https://www.amazon.com')]},
      {id:uid(),name:'Weather',col:3,links:weatherLinks()},
      {id:uid(),name:'Outdoors',col:3,links:[L('REI','https://www.rei.com'),L('Recreation.gov','https://www.recreation.gov'),L('AllTrails','https://www.alltrails.com'),L('Hipcamp','https://www.hipcamp.com')]}
    ]
  };
}
// Weather links carried over from the old start page. Only addresses that could be confirmed are included.
function weatherLinks(){ return [
  L('Forecast for your city','https://www.google.com/search?q=weather+{city}'),
  L('Fort Worth/Dallas, TX (NWS)','https://www.weather.gov/fwd/'),
  L('Storm Prediction Center Outlooks','https://www.spc.noaa.gov/products/outlook/'),
  L('National Hurricane Center','https://www.nhc.noaa.gov/'),
  L('Texas Storm Chasers','https://www.facebook.com/TxStormChasers'),
  L('Purgatory - Weather, Conditions & Webcams','https://www.purgatory.ski/mountain/weather-conditions-webcams/'),
  L('Watch Duty','https://www.watchduty.org/'),
  L('Texas County Burn Bans','https://tfsweb.tamu.edu/wildfire-and-other-disasters/burn-bans-and-information/'),
  L('Clear Fork Trinity River at Fort Worth','https://water.noaa.gov/gauges/FWHT2'),
  L('Clear Fk Trinity Rv nr Benbrook, TX','https://waterdata.usgs.gov/monitoring-location/08047000/')
]; }
const MAX_CITIES=6;
// S.city is the open weather tab; S.cities is the tab list. Older saved data only has S.city.
function fixCities(){
  if(!S.city) S.city='Fort Worth, TX';
  if(!Array.isArray(S.cities)) S.cities=[];
  S.cities=S.cities.filter(c=>typeof c==='string'&&c.trim()).slice(0,MAX_CITIES);
  if(!S.cities.includes(S.city)){ if(S.cities.length>=MAX_CITIES) S.cities.pop(); S.cities.unshift(S.city); }
}
function migrate(){
  S.m1=true;
  if(!S.m2){
    S.m2=true; S.size='small';
    S.groups.forEach(g=>{ if(!g.col) g.col=(g.name==='Popular')?1:3; if(g.name==='Popular'&&g.icons===undefined) g.icons=true; });
  }
  if(!S.m3){ S.m3=true; S.groups=S.groups.filter(g=>g.name!=='Purgatory Webcams'); }
  if(!S.m4){
    S.m4=true;
    const g=S.groups.find(x=>x.name==='Weather links');
    if(g){ g.name='Weather'; g.links=weatherLinks(); }
    else if(!S.groups.some(x=>x.name==='Weather')) S.groups.push({id:uid(),name:'Weather',col:3,links:weatherLinks()});
  }
  if(!S.m5){
    S.m5=true;
    S.groups=S.groups.filter(g=>g.name!=='News links');
    const i=S.groups.findIndex(g=>g.name==='Popular');
    if(i>=0){ const [pop]=S.groups.splice(i,1); pop.col=3; S.groups.unshift(pop); }
  }
  if(!S.m6){
    // Older saved pages named these groups "News" and "Weather"; earlier cleanups only matched the newer names.
    S.m6=true;
    S.groups=S.groups.filter(g=>g.name!=='News'&&g.name!=='News links');
    const w=S.groups.find(x=>x.name==='Weather'||x.name==='Weather links');
    if(w){ w.name='Weather'; w.links=weatherLinks(); } else S.groups.push({id:uid(),name:'Weather',col:3,links:weatherLinks()});
    const i=S.groups.findIndex(g=>g.name==='Popular');
    if(i>=0){ const [pop]=S.groups.splice(i,1); pop.col=3; S.groups.unshift(pop); }
  }
  if(!S.m7){
    // Popular icons move to the top of column 2, above the news cards. Only that group is touched.
    S.m7=true;
    const pop=S.groups.find(g=>g.name==='Popular');
    if(pop) pop.col=2;
  }
  fixCities();
  persist();
}
let S=defaults(), editing=false;
try{ const raw=localStorage.getItem('startpage-v2'); if(raw){ const sv=JSON.parse(raw); S=Object.assign(defaults(),sv); S.m1=!!sv.m1; S.m2=!!sv.m2; S.m3=!!sv.m3; S.m4=!!sv.m4; S.m5=!!sv.m5; S.m6=!!sv.m6; S.m7=!!sv.m7; } }catch(e){}
function persist(){ try{ localStorage.setItem('startpage-v2',JSON.stringify(S)); }catch(e){} }
// save() is for edits by the person: it stamps the change time and queues a sync. persist() only writes locally.
function save(){ S.updated=Date.now(); persist(); queuePush(); }

/* ---------- sync across devices (needs the passcode and /api/data) ---------- */
let pass=''; try{ pass=localStorage.getItem('startpage-pass')||''; }catch(e){}
// Google sign-in (when set up in Vercel) replaces the passcode. The session is an HttpOnly cookie the page can't read,
// so /api/auth/me says who is signed in.
let auth={configured:false,signedIn:false,email:null,redirectUri:''};
function syncOn(){ return auth.configured?auth.signedIn:!!pass; }
function lock(on,msg){ document.body.classList.toggle('locked',!!on); $('#gate-err').textContent=msg||''; }
const SIGNIN_MSG={'not-allowed':"That Google account isn't allowed here. Try your own account.",cancelled:'Sign-in was cancelled.',expired:'Sign-in took too long. Please try again.',failed:"Sign-in didn't work. Please try again.",'not-set-up':"Google sign-in isn't set up yet."};
async function checkAuth(){
  const u=new URL(location.href), m=u.searchParams.get('signin');
  if(m){ u.searchParams.delete('signin'); history.replaceState(null,'',u.pathname+u.search+u.hash); }
  try{
    const r=await fetch('/api/auth/me',{cache:'no-store'}); if(!r.ok) throw 0;
    auth=await r.json();
  }catch(e){ pull(); return; }   // offline or no server: keep working from this device's copy
  if(auth.configured){
    if(pass) dropPass();          // the passcode is retired once Google sign-in is on
    if(auth.signedIn){ lock(false); syncMsg='Sync is on.'; pull().then(()=>checkShop()); loadCalendar(); }
    else lock(true,SIGNIN_MSG[m]||'');
  } else pull();
}
function signedOut(){ auth.signedIn=false; lock(true,'Your sign-in expired. Please sign in again.'); }
let pushTimer=null, pushing=false, again=false, syncMsg=pass?'Sync is on.':'Sync is off on this device.';
function syncStatus(m){ syncMsg=m; const el=$('#sync-status'); if(el) el.textContent=m; }
function dropPass(){ pass=''; try{ localStorage.removeItem('startpage-pass'); }catch(e){} }
async function api(method,body,path){
  const h={'content-type':'application/json'}; if(!auth.configured&&pass) h['x-sync-passcode']=pass;
  const r=await fetch(path||'/api/data',{method,headers:h,credentials:'same-origin',body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  return {status:r.status,j};
}
function adopt(remote){
  const d=remote.data; S=Object.assign(defaults(),d);
  for(const k of ['m1','m2','m3','m4','m5','m6','m7']) S[k]=!!d[k];
  migrate(); S.updated=remote.updated; persist(); render();
}
async function pull(){
  if(!syncOn()) return;
  try{
    const {status,j}=await api('GET');
    if(status===401){ if(j.signin){ signedOut(); return; } dropPass(); syncStatus('Wrong passcode. Sync is off on this device.'); return; }
    if(status!==200){ syncStatus(j.error||'Sync is unavailable right now.'); return; }
    if(j.empty){ await push(); return; }
    const mine=S.updated||0;
    if(j.updated>mine){ const cityChanged=j.data.city!==S.city; adopt(j); if(cityChanged) loadWeather(); syncStatus('Synced.'); }
    else if(j.updated<mine) await push();
    else syncStatus('Synced.');
  }catch(e){ syncStatus('Sync is unavailable right now. Changes stay on this device.'); }
}
async function push(){
  if(!syncOn()) return;
  if(pushing){ again=true; return; }
  pushing=true;
  try{
    if(!S.updated){ S.updated=Date.now(); persist(); }
    const {status,j}=await api('PUT',{data:S,updated:S.updated});
    if(status===200) syncStatus('Synced.');
    else if(status===409){ adopt(j); syncStatus('Synced. Another device had newer changes, so they were loaded here.'); }
    else if(status===401){ if(j.signin) signedOut(); else { dropPass(); syncStatus('Wrong passcode. Sync is off on this device.'); } }
    else syncStatus(j.error||'Sync is unavailable right now.');
  }catch(e){ syncStatus('Sync is unavailable right now. Changes stay on this device.'); }
  pushing=false;
  if(again){ again=false; push(); }
}
function queuePush(){ if(!syncOn()) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,800); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ pull().then(()=>checkShop()); } });

/* ---------- helpers ---------- */
function normUrl(u){
  u=u.trim(); if(!u) return null;
  if(!/^https?:\/\//i.test(u)){ if(/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^[^/]+:\d+/.test(u)) return null; u='https://'+u; }
  try{ const x=new URL(u.replace(/\{city\}/g,'x')); return /^https?:$/.test(x.protocol)?u:null; }catch(e){ return null; }
}
function resolve(u){ return u.replace(/\{city\}/g,encodeURIComponent(S.city||'')); }
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function hostOf(u){ try{ return new URL(u.replace(/\{city\}/g,'x')).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
// Site logo from the web, with a colored letter tile underneath in case it does not load.
function logo(l){
  const host=hostOf(l.u), ch=(l.t.trim()[0]||host[0]||'?').toUpperCase();
  const img=host?`<img src="https://www.google.com/s2/favicons?domain=${esc(host)}&sz=64" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="logo" aria-hidden="true"><i class="tile" style="background:hsl(${hue(host||l.t)} 45% 38%)">${esc(ch)}</i>${img}</span>`;
}
function findGroup(id){ return S.groups.find(g=>g.id===id); }
function colOf(g){ const c=+g.col; return c>=1&&c<=4?c:3; }
function ago(iso){ if(!iso) return ''; const m=Math.round((Date.now()-new Date(iso))/60000); if(m<1) return 'now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' hr ago'; return Math.round(h/24)+' d ago'; }

/* ---------- cards ---------- */
const cache={weather:null,wx:{},news:{},sports:null,cal:null,snow:null,mon:null};
let addingCity=false;
function tasksCard(){
  const d=S.tasks.filter(t=>t.done).length, n=S.tasks.length;
  return `<section class="card" aria-labelledby="h-tasks"><h2 id="h-tasks">Tasks</h2>
  <div class="prog"><span>${d} of ${n}</span><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div></div>
  <ul class="todos">${S.tasks.map(t=>`<li class="${t.done?'done':''}"><input type="checkbox" id="t-${t.id}" data-act="toggle" data-id="${t.id}" ${t.done?'checked':''}><label for="t-${t.id}">${esc(t.t)}</label><button class="x" data-act="deltask" data-id="${t.id}" aria-label="Delete task ${esc(t.t)}">×</button></li>`).join('')}</ul>
  <form class="add" data-form="task"><input id="newtask" placeholder="New task" aria-label="New task" autocomplete="off"><button class="btn pri" type="submit">Add</button></form>
  ${d?`<button class="btn sm" data-act="cleardone" type="button" style="margin-top:6px">Clear completed</button>`:''}
  </section>`;
}
function stormRow(st){
  if(!st) return '';
  const chip=(day,r)=>{
    if(!r) return '';
    const txt=r.none?'None':r.level?`${r.name} ${r.level}/5`:'T-storms';
    return `<span>${day}</span><span class="risk${r.none?' none':''}"${r.none?'':` style="background:${r.color}"`}>${esc(txt)}</span>`;
  };
  const worst=Math.max(...[st.today,st.tomorrow].map(r=>r&&!r.none?r.level:-1));
  return `<a class="storm${worst>=2?' alert':''}" href="https://www.spc.noaa.gov/products/outlook/" target="_blank" rel="noopener" title="Storm Prediction Center severe weather outlook"><span class="lbl">Storms:</span>${chip('Today',st.today)}${chip('Tmrw',st.tomorrow)}</a>`;
}
const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
// Wind "from" direction in degrees; the arrow points the way the wind is blowing (downwind).
/* sunrise / sunset (city's local time, from the forecast) and moon phase (computed) */
function clock(t){ if(!t) return ''; const h=+t.slice(11,13), m=t.slice(14,16); return (h%12||12)+':'+m+(h<12?'a':'p'); }
const MOON_NAMES=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
function moonPhase(d=new Date()){
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);          // a known new moon
  const age=((((d-ref)/864e5)%syn)+syn)%syn, p=age/syn;
  return { p, illum:Math.round((1-Math.cos(2*Math.PI*p))/2*100), name:MOON_NAMES[Math.round(p*8)%8] };
}
function moonIcon(p){
  // lit part: the right half (waxing) plus or minus the half-ellipse of the terminator; mirrored when waning
  const r=6, rx=Math.abs(Math.cos(2*Math.PI*p))*r, frac=p<0.5?p:1-p, sweep=frac>0.25?1:0;
  const lit=frac<0.01?'':`<path d="M0 ${-r} A${r} ${r} 0 0 1 0 ${r} A${rx.toFixed(2)} ${r} 0 0 ${sweep} 0 ${-r}Z" fill="#f2e6b3"${p>=0.5?' transform="scale(-1 1)"':''}/>`;
  return `<svg class="moon" viewBox="-7 -7 14 14" aria-hidden="true"><circle r="${r}" fill="#3a4152"/>${frac>0.49?`<circle r="${r}" fill="#f2e6b3"/>`:lit}</svg>`;
}
function astroLine(day){
  const m=moonPhase(), sun=day&&day.sunrise?`<span title="Sunrise and sunset">↑${clock(day.sunrise)} ↓${clock(day.sunset)}</span>`:'';
  return `<br><span class="astro">${sun}<span title="${m.name}, ${m.illum}% lit">${moonIcon(m.p)}${m.illum}%</span></span>`;
}
function windBug(n){
  if(n.windDir==null) return '';
  const from=COMPASS[Math.round(n.windDir/22.5)%16], calm=n.wind<2;
  const tip=calm?'Calm':`Wind from the ${from} at ${n.wind} mph${n.gust>n.wind+4?', gusts '+n.gust:''}`;
  return `<div class="wbug" title="${tip}" aria-label="${tip}"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"/><text x="18" y="6.2">N</text>${calm?'':`<g transform="rotate(${(n.windDir+180)%360} 18 18)"><path d="M18 7 L23 16 L19.4 15 L19.4 28 L16.6 28 L16.6 15 L13 16 Z"/></g>`}</svg><span>${calm?'Calm':`<b>${from} ${n.wind}</b>${n.gust>n.wind+4?`<small>gust ${n.gust}</small>`:''}`}</span></div>`;
}
function weatherCard(){
  const w=cache.weather;
  let body='<div class="empty">Loading…</div>';

const SHOP_EVERY=3*3600e3, SHOP_RETRY=20*60e3, checking=new Set(), tried={};
const OLD_NET_ERR="Couldn't reach the price checker";   // saved by older code for interrupted checks
// Asks the price checker. Returns null when the check itself didn't complete (page left, iPad asleep,
// network drop, server timeout): that is not the store's answer, so nothing is recorded and it is tried again later.
async function askPrice(url){
  try{
    const r=await fetch('/api/price?r=4&url='+encodeURIComponent(url));
    if(r.status===401) return {error:'Sign in required'};
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j) return null;
    return j;
  }catch(e){ return null; }
}
async function checkItem(id){
  const it0=(S.shop||[]).find(i=>i.id===id); if(!it0) return;
  checking.add(id); renderShop();
  tried[id]=Date.now();
  const d=await askPrice(it0.url);
  checking.delete(id);
  const it=(S.shop||[]).find(i=>i.id===id); if(!it){ renderShop(); return; }   // removed (or replaced by sync) meanwhile
  if(!d){ if(it.error===OLD_NET_ERR){ it.error=null; persist(); } renderShop(); return; }
  const before=JSON.stringify([it.name,it.price,it.inStock,it.error,it.low,it.high,it.was]);
  if(d.price!=null){
    // pv: price reader version. Prices read by an older, less exact reader are dropped, not counted as a change.
    if(it.pv!==4){ it.first=null; it.low=null; it.pv=4; }
    it.price=d.price; it.high=d.high??d.price; it.inStock=d.inStock; it.error=null; it.was=d.was||null;
    if(d.name) it.name=d.name;
    if(it.first==null) it.first=d.price;
    it.low=it.low==null?d.price:Math.min(it.low,d.price);
  } else { it.error=d.error||"Couldn't read the price"; if(!it.name&&d.name) it.name=d.name; }
  it.checked=Date.now();
  if(JSON.stringify([it.name,it.price,it.inStock,it.error,it.low,it.high,it.was])!==before) save(); else persist();
  renderShop(); softRender();
}

function shopDue(it){
  if(tried[it.id]&&Date.now()-tried[it.id]<SHOP_RETRY) return false;   // tried recently on this device
  if(!it.checked||it.pv!==4||it.error===OLD_NET_ERR) return true;
  return Date.now()-it.checked>(it.error?SHOP_RETRY:SHOP_EVERY);
}
async function checkShop(force){
  if(shopBusy||!auth.signedIn) return; shopBusy=true;
  try{
    const due=(S.shop||[]).filter(it=>force||shopDue(it)).map(it=>it.id);
    const work=async()=>{ while(due.length) await checkItem(due.shift()); };
    await Promise.all([work(),work(),work()]);   // three at a time: a round finishes before you switch away
  } finally{ shopBusy=false; }
}

    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Tap to remove'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent='Remove'; } },4000); return; }
    S.shop=S.shop.filter(i=>i.id!==it.id); save(); renderShop(); softRender();
  } else if(b.dataset.shop==='target'){
    const cell=b.closest('.shop-item').querySelector('.meta');
    cell.innerHTML=`<form class="shop-add" data-tid="${it.id}"><span class="shop-target"><span aria-hidden="true">$</span><input inputmode="decimal" value="${it.target??''}" aria-label="Target price" placeholder="none"></span><button class="btn sm" type="submit">Save</button></form>`;
    const f=cell.querySelector('form'), inp=f.querySelector('input'); inp.focus(); inp.select();
    f.addEventListener('submit',ev=>{ ev.preventDefault(); const v=inp.value.replace(/[$,\s]/g,''); if(v&&!(+v>0)){ inp.setCustomValidity('Enter a price'); inp.reportValidity(); return; } it.target=v?+(+v).toFixed(2):null; save(); renderShop(); softRender(); });
  }
});
function monCard(){
  const d=cache.mon;
  let inner;
  if(!d) inner='<span class="stk-msg">Checking conditions…</span>';
  else if(d.error) inner='<span class="stk-msg">Monitoring is unavailable right now</span>';
  else inner=d.rows.map(r=>`<span class="stk stk-${r.status}" title="${esc(r.title+': '+r.value)}"><i class="dot st-${r.status}"></i>${esc(r.label||r.title)} <b>${esc(r.short||r.value)}</b></span>`).join('');
  return `<a class="card stickers" href="#monitoring" aria-label="Monitoring summary. Open the Monitoring tab for details.">${inner}<span class="stk-go" aria-hidden="true">›</span></a>`;
}
function renderMon(){
  const d=cache.mon, box=$('#mon-rows'), badge=$('#mon-badge');
  if(!box) return;
  if(!d){ box.innerHTML='<div class="empty">Loading…</div>'; return; }
  if(d.error){ box.innerHTML=`<div class="empty" role="alert">${esc(d.error)} <button class="btn sm" type="button" id="mon-retry">Retry</button></div>`; $('#mon-retry').onclick=()=>loadMonitor(true); badge.hidden=true; return; }
  const words={green:'OK',yellow:'Heads up',red:'Alert',gray:'No data'};
  box.innerHTML=d.rows.map(r=>`<div class="mrow"><span class="dot st-${r.status}" role="img" aria-label="${words[r.status]||''}"></span><span class="t">${esc(r.title)}</span><span class="v">${esc(r.value)}</span>${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">Source ↗</a>`:''}<span class="d">${esc(r.detail||'')}</span></div>`).join('');
  $('#mon-when').textContent=(d.place?d.place+' · ':'')+'checked '+new Date(d.checked).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const hot=d.rows.filter(r=>r.status==='red'||r.status==='yellow');
  badge.hidden=!hot.length; badge.textContent=hot.length;
  badge.className='mbadge '+(hot.some(r=>r.status==='red')?'st-red':'st-yellow');
  badge.title=hot.map(r=>r.title+': '+r.value).join('\n');
}
async function loadMonitor(force){
  if(!force&&monCity===S.city&&(monBusy||cache.mon&&!cache.mon.error)) return;
  const c=S.city||''; if(monCity!==c){ cache.mon=null; renderMon(); softRender(); } monCity=c;
  monBusy=true;
  const d=await getJson('/api/monitor?city='+encodeURIComponent(c)).catch(()=>({error:'Monitoring data is unavailable right now'}));
  monBusy=false;
  if(S.city===c){ cache.mon=d; renderMon(); softRender(); }
}
async function loadCalendar(){ if(!auth.signedIn) return; cache.cal=await getJson('/api/calendar').catch(()=>({error:'Calendar is unavailable right now'})); softRender(); }
async function loadSports(){ cache.sports=await getJson('/api/sports').catch(()=>({error:'Scores are unavailable right now'})); softRender(); }
async function loadNews(key){ cache.news[key]=null; softRender(); cache.news[key]=await getJson('/api/news?feed='+key).catch(()=>({error:'Could not load this feed'})); softRender(); }

/* ---------- actions ---------- */
const root=$('#cols');
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'&&b.type!=='checkbox') return;
  const act=b.dataset.act, g=b.dataset.g?findGroup(b.dataset.g):null;
  if(act==='toggle'){ const t=S.tasks.find(x=>x.id===b.dataset.id); t.done=b.checked; }
  else if(act==='deltask'){ S.tasks=S.tasks.filter(x=>x.id!==b.dataset.id); }
  else if(act==='cleardone'){ S.tasks=S.tasks.filter(x=>!x.done); }
  else if(act==='dellink'){ g.links=g.links.filter(l=>l.id!==b.dataset.id); }
  else if(act==='icons'){ g.icons=!g.icons; }
  else if(act==='up'||act==='down'){ const i=S.groups.indexOf(g), j=act==='up'?i-1:i+1; if(j<0||j>=S.groups.length) return; [S.groups[i],S.groups[j]]=[S.groups[j],S.groups[i]]; }
  else if(act==='wxtab'){ const c=S.cities[+b.dataset.i]; if(!c||c===S.city) return; S.city=c; addingCity=false; save(); render(); loadWeather(); return; }
  else if(act==='wxadd'){ addingCity=!addingCity; render(); const i=$('#city-input'); if(i) i.focus(); return; }
  else if(act==='wxdel'){
    if(S.cities.length<2) return;
    const i=+b.dataset.i, gone=S.cities[i]; S.cities.splice(i,1);
    if(gone===S.city){ S.city=S.cities[Math.max(0,i-1)]; save(); render(); loadWeather(); return; }
    save(); render(); return;
  }
  else if(act==='retry-news'){ loadNews(b.dataset.key); return; }
  else if(act==='retry-sports'){ loadSports(); return; }
  else if(act==='retry-cal'){ cache.cal=null; render(); loadCalendar(); return; }
  else if(act==='delgroup'){
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; }
    S.groups=S.groups.filter(x=>x!==g);
  } else return;
  save(); render();
});
root.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='rename'){ const g=findGroup(el.dataset.g); g.name=el.value.trim()||g.name; save(); }
  if(el.dataset.act==='col'){ findGroup(el.dataset.g).col=+el.value; save(); render(); }
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, kind=f.dataset.form;
  if(kind==='task'){ const v=f.querySelector('input').value.trim(); if(!v) return; S.tasks.unshift({id:uid(),t:v,done:false}); }
  else if(kind==='group'){ const v=f.querySelector('input').value.trim(); if(!v) return; S.groups.push({id:uid(),name:v,col:4,links:[]}); }
  else if(kind==='city'){
    const v=f.querySelector('input').value.trim(); if(!v) return;
    const have=S.cities.find(c=>c.toLowerCase()===v.toLowerCase());
    if(!have&&S.cities.length>=MAX_CITIES) return;
    if(!have) S.cities.push(v);
    S.city=have||v; addingCity=false; save(); render(); loadWeather(); return;
  }
  else if(kind==='link'){
    const t=f.elements.t.value.trim(), u=normUrl(f.elements.u.value);
    if(!u){ f.elements.u.focus(); f.elements.u.setCustomValidity('Enter a web address'); f.elements.u.reportValidity(); f.elements.u.setCustomValidity(''); return; }
    findGroup(f.dataset.g).links.push(L(t||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],u));
  } else return;
  save(); render();
  if(kind==='task') $('#newtask').focus();
});

$('#btn-set').onclick=()=>{

$('#s-connect').onclick=async()=>{
  const v=$('#s-pass').value; if(!v){ syncStatus('Enter your passcode first.'); return; }
  pass=v; try{ localStorage.setItem('startpage-pass',pass); }catch(e){}
  $('#s-pass').value=''; $('#s-pass').placeholder='Saved on this device'; syncStatus('Connecting…'); await pull();
};
async function loadBackups(){
  const ui=$('#bk-ui'), sel=$('#s-bk'), go=$('#s-bk-go');
  ui.hidden=!syncOn(); go.dataset.armed=''; go.textContent='Restore this backup'; $('#bk-status').textContent='';
  if(!syncOn()) return;
  sel.innerHTML='<option>Loading…</option>'; go.disabled=true;
  const {status,j}=await api('GET',null,'/api/data?backups').catch(()=>({status:0,j:{}}));
  if(status!==200){ sel.innerHTML='<option>Backups are unavailable right now</option>'; return; }
  const opts=j.backups.map(d=>`<option value="${d}">${fromKey(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}${d===lkey(new Date())?' (start of today)':''}</option>`);
  if(j.beforeRestore) opts.unshift('<option value="before-restore">Just before the last restore</option>');
  sel.innerHTML=opts.join('')||'<option>No backups yet — one is made the first time you change something each day</option>';
  go.disabled=!opts.length;
}
$('#s-bk').onchange=()=>{ const go=$('#s-bk-go'); go.dataset.armed=''; go.textContent='Restore this backup'; };
$('#s-bk-go').onclick=async()=>{
  const go=$('#s-bk-go'), id=$('#s-bk').value;
  if(!go.dataset.armed){ go.dataset.armed='1'; go.textContent='Tap again to replace your page with this backup'; return; }
  go.disabled=true; $('#bk-status').textContent='Restoring…';
  clearTimeout(pushTimer);
  const {status,j}=await api('POST',{restore:id}).catch(()=>({status:0,j:{}}));
  if(status===200){ adopt(j); $('#s-io').value=JSON.stringify(S); $('#bk-status').textContent='Restored. Your other devices will pick it up next time they open the page.'; loadBackups().then(()=>$('#bk-status').textContent='Restored. Your other devices pick it up next time they open the page.'); }
  else { $('#bk-status').textContent=j.error||"Couldn't restore right now."; go.disabled=false; go.dataset.armed=''; go.textContent='Restore this backup'; }
};
$('#s-signout').onclick=async()=>{
  const b=$('#s-signout'); b.disabled=true; b.textContent='Signing out…';
  clearTimeout(pushTimer); try{ await push(); }catch(e){}            // save any last change first
  try{ await fetch('/api/auth/logout',{method:'POST'}); }catch(e){}
  try{ localStorage.removeItem('startpage-v2'); }catch(e){}         // don't leave your data on a shared device
  location.replace('/');
};
$('#s-disconnect').onclick=()=>{ dropPass(); $('#s-pass').value=''; $('#s-pass').placeholder='Same passcode on every device'; syncStatus('Sync is off on this device.'); };
$('#s-city').addEventListener('change',e=>{ const v=e.target.value.trim(); if(!v) return; const i=S.cities.indexOf(S.city); if(i>=0) S.cities[i]=v; S.city=v; fixCities(); save(); render(); loadWeather(); });
$('#s-size').addEventListener('change',e=>{ S.size=e.target.value; save(); render(); });
$('#s-copy').onclick=async()=>{
  $('#s-io').value=JSON.stringify(S); $('#s-io').select();

  catch(e){ $('#s-status').textContent='Select the text above and copy it.'; }
};
$('#s-import').onclick=()=>{
  try{
    const d=JSON.parse($('#s-io').value);
    if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks)) throw 0;
    S=Object.assign(defaults(),d); S.m1=!!d.m1; S.m2=!!d.m2; S.m3=!!d.m3; S.m4=!!d.m4; S.m5=!!d.m5; S.m6=!!d.m6; S.m7=!!d.m7; migrate(); save(); render(); loadWeather();
    $('#s-city').value=S.city; $('#s-size').value=S.size;
    $('#s-status').textContent='Restored.';
  }catch(e){ $('#s-status').textContent='That text is not a valid backup.'; }
};
